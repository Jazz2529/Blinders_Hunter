name: blinders_hunter
description: Blinders Hunter — Jeu de rôles cachés
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  uuid: ^4.3.3
  http: ^1.2.0
  shared_preferences: ^2.2.2
  flutter_lints: ^3.0.0
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  # IMPORTANT (Android) : on NE configure PAS adaptive_icon_background /
  # adaptive_icon_foreground volontairement. Le système d'icônes adaptatives
  # d'Android (8+) applique TOUJOURS un masque qui ne montre qu'environ 66%
  # du centre de l'image, même parfaitement configuré. En ne fournissant QUE
  # image_path (pas d'adaptive), l'icône remplit tout l'espace disponible.
  # iOS n'a pas cette contrainte — l'icône remplira nativement tout le carré
  # (avec les coins arrondis automatiques du système, sans recadrage caché).
  image_path: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/tokens/
    - assets/images/terrains/
    - assets/images/characters/
    - assets/images/cards/
    - assets/audio/
  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cinzel-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cinzel-Black.ttf
          weight: 900
    - family: CrimsonText
      fonts:
        - asset: assets/fonts/CrimsonText-Regular.ttf
        - asset: assets/fonts/CrimsonText-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/CrimsonText-Italic.ttf
          style: italic
