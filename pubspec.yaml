name: blinders_hunter
description: Blinders Hunter — Jeu de rôles cachés
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  firebase_database: ^11.1.6
  provider: ^6.1.1
  uuid: ^4.3.3
  http: ^1.2.0
  shared_preferences: ^2.2.2
  flutter_lints: ^3.0.0
  audioplayers: ^6.0.0
  

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/tokens/
    - assets/images/terrains/
    - assets/images/characters/
    - assets/images/cards/
    - assets/audio/
  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cinzel-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cinzel-Black.ttf
          weight: 900
    - family: CrimsonText
      fonts:
        - asset: assets/fonts/CrimsonText-Regular.ttf
        - asset: assets/fonts/CrimsonText-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/CrimsonText-Italic.ttf
          style: italic
