<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#1e1608"/>
  <!-- Sol -->
  <rect x="0" y="50" width="64" height="14" fill="#3d2b0a"/>
  <!-- Bâtiment marché -->
  <rect x="8" y="24" width="48" height="28" fill="#5c3d15"/>
  <rect x="8" y="20" width="48" height="6" fill="#d4a017"/>
  <!-- Toit triangulaire -->
  <polygon points="4,24 32,8 60,24" fill="#8b2500"/>
  <polygon points="8,24 32,12 56,24" fill="#a83000"/>
  <!-- Fenêtres -->
  <rect x="14" y="30" width="8" height="10" fill="#1a0e00"/>
  <rect x="28" y="30" width="8" height="10" fill="#1a0e00"/>
  <rect x="42" y="30" width="8" height="10" fill="#1a0e00"/>
  <!-- Lueur fenêtres -->
  <rect x="15" y="31" width="6" height="8" fill="#d4a017" opacity="0.3"/>
  <rect x="29" y="31" width="6" height="8" fill="#d4a017" opacity="0.3"/>
  <rect x="43" y="31" width="6" height="8" fill="#d4a017" opacity="0.3"/>
  <!-- Porte -->
  <rect x="26" y="38" width="12" height="14" fill="#2a1800"/>
  <!-- Étoiles -->
  <rect x="6" y="4" width="2" height="2" fill="#ffffff" opacity="0.8"/>
  <rect x="30" y="2" width="1" height="1" fill="#d4a017"/>
  <rect x="54" y="6" width="2" height="2" fill="#ffffff" opacity="0.6"/>
  <!-- Enseignes -->
  <rect x="10" y="22" width="6" height="2" fill="#c8900d"/>
  <rect x="48" y="22" width="6" height="2" fill="#c8900d"/>
</svg>
