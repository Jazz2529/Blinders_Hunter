<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#0a1a0a"/>
  <!-- Ciel nuit -->
  <rect x="0" y="0" width="64" height="40" fill="#0a1408"/>
  <!-- Sol herbe -->
  <rect x="0" y="40" width="64" height="24" fill="#1a3a0a"/>
  <rect x="0" y="38" width="64" height="4" fill="#2a5010"/>
  <!-- Lune -->
  <circle cx="50" cy="12" r="6" fill="#d4c87a"/>
  <circle cx="53" cy="10" r="5" fill="#0a1408"/>
  <!-- Arbres encadrants -->
  <rect x="2" y="20" width="6" height="22" fill="#3a2010"/>
  <polygon points="0,22 5,6 10,22" fill="#1a4010"/>
  <polygon points="1,26 5,12 9,26" fill="#206010"/>
  <rect x="56" y="20" width="6" height="22" fill="#3a2010"/>
  <polygon points="54,22 59,6 64,22" fill="#1a4010"/>
  <polygon points="55,26 59,12 63,26" fill="#206010"/>
  <!-- Cible/arène centrale -->
  <circle cx="32" cy="38" r="14" fill="#1a3a0a"/>
  <circle cx="32" cy="38" r="12" fill="none" stroke="#cc2222" stroke-width="1"/>
  <circle cx="32" cy="38" r="8" fill="none" stroke="#cc2222" stroke-width="1" opacity="0.6"/>
  <circle cx="32" cy="38" r="4" fill="#cc2222" opacity="0.3"/>
  <!-- Croix cible -->
  <rect x="31" y="26" width="2" height="24" fill="#cc2222" opacity="0.4"/>
  <rect x="20" y="37" width="24" height="2" fill="#cc2222" opacity="0.4"/>
  <!-- Étoiles -->
  <rect x="20" y="6" width="2" height="2" fill="#ffffff" opacity="0.7"/>
  <rect x="34" y="4" width="1" height="1" fill="#ffffff"/>
  <rect x="42" y="8" width="1" height="1" fill="#d4a017"/>
</svg>
