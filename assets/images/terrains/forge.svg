<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#0e0a06"/>
  <!-- Sol -->
  <rect x="0" y="50" width="64" height="14" fill="#1a1008"/>
  <!-- Forge -->
  <rect x="8" y="28" width="24" height="24" fill="#3d2010"/>
  <rect x="8" y="24" width="24" height="6" fill="#2a1808"/>
  <!-- Cheminée -->
  <rect x="14" y="8" width="10" height="18" fill="#2a1808"/>
  <rect x="12" y="6" width="14" height="4" fill="#1a1008"/>
  <!-- Fumée/feu sortant cheminée -->
  <rect x="16" y="2" width="4" height="6" fill="#cc4400" opacity="0.7"/>
  <rect x="15" y="0" width="6" height="4" fill="#ff6600" opacity="0.5"/>
  <rect x="17" y="0" width="2" height="2" fill="#ffaa00" opacity="0.8"/>
  <!-- Feu dans la forge -->
  <rect x="14" y="40" width="10" height="10" fill="#cc2200"/>
  <rect x="15" y="38" width="8" height="8" fill="#ff4400"/>
  <rect x="17" y="36" width="4" height="6" fill="#ff8800"/>
  <rect x="18" y="34" width="2" height="4" fill="#ffcc00"/>
  <!-- Enclume -->
  <rect x="36" y="38" width="20" height="8" fill="#666666"/>
  <rect x="38" y="34" width="16" height="6" fill="#888888"/>
  <rect x="42" y="46" width="4" height="6" fill="#555555"/>
  <rect x="40" y="50" width="8" height="2" fill="#444444"/>
  <!-- Marteau -->
  <rect x="46" y="28" width="4" height="12" fill="#8b4513"/>
  <rect x="42" y="26" width="12" height="6" fill="#777777"/>
  <!-- Lueur rouge -->
  <rect x="8" y="28" width="24" height="24" fill="#ff4400" opacity="0.05"/>
</svg>
